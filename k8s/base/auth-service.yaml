apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: auth-service:v9
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        ports:
        - containerPort: 3000
        - containerPort: 50051
        env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: pagepulse-config
              key: HTTP_PORT
        - name: GRPC_PORT
          valueFrom:
            configMapKeyRef:
              name: pagepulse-config
              key: GRPC_PORT_AUTH
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: DB_URL
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: RABBITMQ_URL
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: JWT_SECRET
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
spec:
  type: NodePort
  selector:
    app: auth-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30001
  - name: grpc
    port: 50051
    targetPort: 50051
    nodePort: 30002
