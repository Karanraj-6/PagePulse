syntax = "proto3";

package book;

service BookService {
  // Synchronous communication: Check if a book exists/is available
  rpc GetBook (GetBookRequest) returns (BookResponse);
  rpc CheckAvailability (BookId) returns (AvailabilityResponse);
}

message GetBookRequest {
  string id = 1;
}

message BookResponse {
  string id = 1;
  string title = 2;
  string author = 3;
  double price = 4;
}

message BookId {
  string id = 1;
}

message AvailabilityResponse {
  bool available = 1;
  int32 quantity = 2;
}
