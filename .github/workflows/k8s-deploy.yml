name: PagePulse CI/CD
# Trigger pipeline on push to main branch or PR merge
on:
  push:
    branches:
      - main
  pull_request:

env:
  IMAGE_TAG: ${{ github.sha }}  # Use commit SHA as Docker image tag

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      # Docker Hub credentials
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
      # K8s Cluster credentials
      OCI_CLI_USER: ${{ secrets.OCI_CLI_USER }}
      OCI_CLI_TENANCY: ${{ secrets.OCI_CLI_TENANCY }}
      OCI_CLI_FINGERPRINT: ${{ secrets.OCI_CLI_FINGERPRINT }}
      OCI_CLI_KEY_CONTENT: ${{ secrets.OCI_CLI_KEY_CONTENT }}
      OCI_CLI_REGION: ${{ secrets.OCI_CLI_REGION }}      # e.g., us-ashburn-1
      OKE_CLUSTER_OCID: ${{ secrets.OKE_CLUSTER_OCID }}   # The ID of your cluster

    steps:
      # Step 1: Checkout code
      - name: Checkout repository
        uses: actions/checkout@v3

      # Step 2: Set up Docker

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Log in to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}

      # Step 3: Build and push Docker images with SHA tags
      - name: Build and push auth-service image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}
          context: .
          file: services/auth-service/Dockerfile

      - name: Build and push book-service image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/book-service:${{ env.IMAGE_TAG }}
          context: .
          file: services/book-service/Dockerfile

      - name: Build and push chat-service image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/chat-service:${{ env.IMAGE_TAG }}
          context: .
          file: services/chat-service/Dockerfile

      - name: Build and push notification-service image
        uses: docker/build-push-action@v5
        with:
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ env.IMAGE_TAG }}
          context: .
          file: services/notification-service/Dockerfile

      # Step 4.1: Install and configure OCI CLI
      - name: Install OCI CLI
        run: |
          pip install oci-cli

      - name: Configure OCI CLI
        run: |
          mkdir -p ~/.oci
          echo "${{ secrets.OCI_CLI_KEY_CONTENT }}" > ~/.oci/oci_api_key.pem
          chmod 600 ~/.oci/oci_api_key.pem
          printf '[DEFAULT]\nuser=%s\nfingerprint=%s\ntenancy=%s\nregion=%s\nkey_file=%s\n' \
            "${{ secrets.OCI_CLI_USER }}" \
            "${{ secrets.OCI_CLI_FINGERPRINT }}" \
            "${{ secrets.OCI_CLI_TENANCY }}" \
            "${{ secrets.OCI_CLI_REGION }}" \
            "$HOME/.oci/oci_api_key.pem" > ~/.oci/config
          chmod 600 ~/.oci/config
          echo "=== OCI Config Debug ==="
          oci setup repair-file-permissions --file ~/.oci/config 2>/dev/null || true
          oci setup repair-file-permissions --file ~/.oci/oci_api_key.pem 2>/dev/null || true
          cat ~/.oci/config

      # Step 4.2: Generate OKE Kubeconfig
      # Instead of pasting a static file, we generate a fresh valid one
      - name: Get OKE Kubeconfig
        run: |
          mkdir -p $HOME/.kube
          oci ce cluster create-kubeconfig --cluster-id ${{ secrets.OKE_CLUSTER_OCID }} --file $HOME/.kube/config --region ${{ secrets.OCI_CLI_REGION }} --token-version 2.0.0 
          chmod 600 $HOME/.kube/config

      # Step 5: Apply ConfigMap FIRST (infrastructure needs configMapKeyRef)
      - name: Apply ConfigMap
        run: kubectl apply -f k8s/base/config-map.yaml

      # Step 6: Create Secrets from GitHub Secrets
      - name: Create pagepulse-secrets in Kubernetes
        run: |
          kubectl create secret generic pagepulse-secrets \
            --from-literal=POSTGRES_USER=${{ secrets.POSTGRES_USER }} \
            --from-literal=POSTGRES_PASSWORD=${{ secrets.POSTGRES_PASSWORD }} \
            --from-literal=POSTGRES_CHAT_USER=${{ secrets.POSTGRES_CHAT_USER }} \
            --from-literal=POSTGRES_CHAT_PASSWORD=${{ secrets.POSTGRES_CHAT_PASSWORD }} \
            --from-literal=DB_URL=${{ secrets.DB_URL }} \
            --from-literal=DB_URL_CHAT=${{ secrets.DB_URL_CHAT }} \
            --from-literal=RABBITMQ_DEFAULT_USER=${{ secrets.RABBITMQ_DEFAULT_USER }} \
            --from-literal=RABBITMQ_DEFAULT_PASS=${{ secrets.RABBITMQ_DEFAULT_PASS }} \
            --from-literal=RABBITMQ_URL=${{ secrets.RABBITMQ_URL }} \
            --from-literal=MONGODB_USER=${{ secrets.MONGODB_USER }} \
            --from-literal=MONGODB_PASSWORD=${{ secrets.MONGODB_PASSWORD }} \
            --from-literal=MONGODB_DB=${{ secrets.MONGODB_DB }} \
            --from-literal=MONGODB_URL=${{ secrets.MONGODB_URL }} \
            --from-literal=JWT_SECRET=${{ secrets.JWT_SECRET }} \
            --from-literal=SMTP_USER=${{ secrets.SMTP_USER }} \
            --from-literal=SMTP_PASS=${{ secrets.SMTP_PASS }} \
            --from-literal=AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }} \
            --from-literal=AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }} \
            --from-literal=S3_BUCKET_NAME=${{ secrets.S3_BUCKET_NAME }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Step 6.1: Create Docker Hub pull secret for authenticated image pulls
      - name: Create Docker Hub pull secret
        run: |
          kubectl create secret docker-registry dockerhub-secret \
            --docker-server=https://index.docker.io/v1/ \
            --docker-username=${{ secrets.DOCKERHUB_USERNAME }} \
            --docker-password=${{ secrets.DOCKERHUB_PASSWORD }} \
            --dry-run=client -o yaml | kubectl apply -f -

      # Step 7: Install cert-manager (required for ClusterIssuer CRD)
      - name: Install cert-manager
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.14.4/cert-manager.yaml
          echo "Waiting for cert-manager to be ready..."
          kubectl wait --for=condition=Available --timeout=120s deployment/cert-manager -n cert-manager
          kubectl wait --for=condition=Available --timeout=120s deployment/cert-manager-webhook -n cert-manager

      # Step 8: Apply infrastructure (DB, Redis, RabbitMQ) + ClusterIssuer
      - name: Apply infrastructure manifests
        run: kubectl apply -f k8s/infrastructure/

      # Step 8.5: Wait for infrastructure to be ready
      - name: Wait for infrastructure pods
        run: |
          echo "=== Current PVC status ==="
          kubectl get pvc
          echo ""
          echo "=== Current Pod status ==="
          kubectl get pods
          echo ""
          echo "Waiting for PostgreSQL..."
          kubectl wait --for=condition=Ready pod -l app=postgres --timeout=180s || true
          echo "Waiting for PostgreSQL Chat..."
          kubectl wait --for=condition=Ready pod -l app=postgres-chat --timeout=180s || true
          echo "Waiting for Redis..."
          kubectl wait --for=condition=Ready pod -l app=redis --timeout=120s || true
          echo "Waiting for RabbitMQ..."
          kubectl wait --for=condition=Ready pod -l app=rabbitmq --timeout=120s || true
          echo ""
          echo "=== Final infrastructure status ==="
          kubectl get pods
          kubectl get pvc
          echo ""
          echo "=== Events (last 5 min) ==="
          kubectl get events --sort-by=.lastTimestamp | tail -30

      # Step 9: Apply Microservices Deployments (excluding secrets.yaml)
      - name: Apply base manifests
        run: |
          kubectl apply -f k8s/base/auth-service.yaml
          kubectl apply -f k8s/base/book-service.yaml
          kubectl apply -f k8s/base/chat-service.yaml
          kubectl apply -f k8s/base/notification-service.yaml
          kubectl apply -f k8s/base/hpa.yaml

      # Step 10: Update Deployments with SHA images
      - name: Set deployment images to sha and wait for rollout
        run: |
          kubectl set image deployment/auth-deployment auth-container=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/auth-service:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/auth-deployment --timeout=300s

          kubectl set image deployment/book-deployment book-container=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/book-service:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/book-deployment --timeout=300s

          kubectl set image deployment/chat-deployment chat-container=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/chat-service:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/chat-deployment --timeout=300s

          kubectl set image deployment/notification-deployment notification-container=docker.io/${{ secrets.DOCKERHUB_USERNAME }}/notification-service:${{ env.IMAGE_TAG }}
          kubectl rollout status deployment/notification-deployment --timeout=300s

      # Step 11: Apply Ingress
      - name: Apply Ingress
        run: kubectl apply -f k8s/ingress.yaml

      # Step 12: Verify Deployment
      - name: Get all pods
        run: kubectl get pods -o wide

      - name: Get all services
        run: kubectl get svc -o wide

      # Step 13: Debug on failure - show pod logs if something crashed
      - name: Debug pod status on failure
        if: failure()
        run: |
          echo "=== Pod Status ==="
          kubectl get pods -o wide
          echo ""
          echo "=== Describe failing pods ==="
          kubectl describe pods --field-selector=status.phase!=Running 2>/dev/null || true
          echo ""
          echo "=== Auth Service Logs ==="
          kubectl logs deployment/auth-deployment --tail=50 2>/dev/null || true
          echo ""
          echo "=== Book Service Logs ==="
          kubectl logs deployment/book-deployment --tail=50 2>/dev/null || true
          echo ""
          echo "=== Chat Service Logs ==="
          kubectl logs deployment/chat-deployment --tail=50 2>/dev/null || true
          echo ""
          echo "=== Notification Service Logs ==="
          kubectl logs deployment/notification-deployment --tail=50 2>/dev/null || true
