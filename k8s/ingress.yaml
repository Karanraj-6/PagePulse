apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pagepulse-ingress
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    nginx.ingress.kubernetes.io/use-regex: "true"
spec:
  rules:
  - http:
      paths:
      - path: /api/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      - path: /api/books(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: book-service
            port:
              number: 3000
      - path: /api/chat(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chat-service
            port:
              number: 3000
      - path: /api/notification(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: notification-service
            port:
              number: 3000
