apiVersion: v1
kind: ConfigMap
metadata:
  name: pagepulse-config
data:
  NODE_ENV: "production"

  # PostgreSQL
  POSTGRES_DB: "pagepulse_db"
  POSTGRES_USER: "pagepulse-user"
  POSTGRES_CHAT_DB: "chat_db"
  POSTGRES_CHAT_USER: "pagepulse-chat"
  POSTGRES_PORT: "5432"
  POSTGRES_CHAT_PORT: "5432"

  # RabbitMQ
  RABBITMQ_DEFAULT_USER: "guest"
  RABBITMQ_PORT: "5672"
  RABBITMQ_MGMT_PORT: "15672"

  # Redis
  REDIS_URL: "redis://redis-service:6379"
  REDIS_PORT: "6379"

  # Service Ports
  HTTP_PORT: "3000"
  GRPC_PORT_AUTH: "50051"
  GRPC_PORT_BOOK: "50052"
  GRPC_PORT_CHAT: "50053"

  # SMTP
  SMTP_HOST: "smtp.gmail.com"
  SMTP_PORT: "587"

  # AWS
  AWS_REGION: "us-east-1"

  # Public URLs
  PUBLIC_URL: "https://68.233.107.28.nip.io"
  APP_PUBLIC_URL: "https://pagepulse-ebon.vercel.app"

  #MongoDB
  MONGODB_PORT: "27017"