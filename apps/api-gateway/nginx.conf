events {
    worker_connections 1024;   #Controls how many connections NGINX can handlew worker_connections = 1024; each worker process can handle 1024 simultaneous connections.
}

http {
    # http:  
    # This is where all web stuff lives:
    # Reverse proxy
    # Load balancing
    # Headers
    # Routing
    # APIs
    # Without this, NGINX can’t serve HTTP traffic.

    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s; 

    upstream auth_service {
        server auth-service:3000;     # auth_service = logical name; auth-service = Docker Compose service name; 3000 = port inside container
    }

    upstream book_service {
        server book-service:3000;     # book_service = logical name; book-service = Docker Compose service name; 3000 = port inside container
    }

    upstream chat_service {
        server chat-service:3000;     # chat-service = logical name; chat-service = Docker Compose service name; 3000 = port inside container
    }

    upstream payment_service {
        server payment-service:3000;     # payment-service = logical name; payment-service = Docker Compose service name; 3000 = port inside container
    }

    upstream notification_service {
        server notification-service:3000;     # notification-service = logical name; notification-service = Docker Compose service name; 3000 = port inside container
    }

    server {

        # A virtual server
        # Listening on port 80
        # This is your entry point (API Gateway)

        listen 80;
        
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        location /api/auth {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/auth/?(.*) /$1 break;  # our auth service probably exposes /login, not /api/auth/login.
            proxy_pass http://auth_service;     # auth_service = logical name; auth-service = Docker Compose service name; 3000 = port inside container
            proxy_set_header Host $host;     # When forwarding the request to the backend service, keep the original domain name the client used
            
            # 'Host' is an HTTP request header.
            # Example request from browser:
            #     GET /api/auth/login HTTP/1.1
            #     Host: api.myapp.com
            # Host tells the server which domain the client is trying to reach;
            # $host is an NGINX variable. 

        }

        location /api/books {

            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/books/?(.*) /$1 break;  # our book service probably exposes /books, not /api/books/books.
            proxy_pass http://book_service;     # book_service = logical name; book-service = Docker Compose service name; 3000 = port inside container
            proxy_set_header Host $host;
        }

        location /api/chat {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/chat/?(.*) /$1 break;  # our chat service probably exposes /chat, not /api/chat/chat.
            proxy_pass http://chat_service;     # chat-service = logical name; chat-service = Docker Compose service name; 3000 = port inside container
            proxy_set_header Host $host;
        }

        location /api/payment {
            limit_req zone=api_limit burst=20 nodelay;
            rewrite ^/api/payment/?(.*) /$1 break;  # our payment service probably exposes /payment, not /api/payment/payment.
            proxy_pass http://payment_service;     # payment-service = logical name; payment-service = Docker Compose service name; 3000 = port inside container
            proxy_set_header Host $host;
        }

        location /api/notification {

            rewrite ^/api/notification/?(.*) /$1 break;  # our notification service probably exposes /notification, not /api/notification/notification.
            proxy_pass http://notification_service;     # notification-service = logical name; notification-service = Docker Compose service name; 3000 = port inside container
            proxy_set_header Host $host;
        }   
    }
}
