# ===========================================
# PagePulse - Development Docker Compose
# HOT RELOAD enabled
# ===========================================

services:
  # --- Infrastructure ---
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    networks:
      - pagepulse-network
    healthcheck:
      test: rabbitmq-diagnostics -q ping
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:alpine
    ports:
      - "6379:6379"
    networks:
      - pagepulse-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: secure_password_123
      POSTGRES_DB: pagepulse_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - pagepulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d pagepulse_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  postgres-chat:
    image: postgres:15
    environment:
      POSTGRES_USER: chat_admin
      POSTGRES_PASSWORD: chat_secure_pass_456
      POSTGRES_DB: chat_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_chat_data:/var/lib/postgresql/data
    networks:
      - pagepulse-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chat_admin -d chat_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  # --- Auth Service ---
  auth-service:
    build:
      context: .
      dockerfile: services/auth-service/Dockerfile.dev
    ports:
      - "3001:3000"
      - "50051:50051"
    volumes:
      - ./services/auth-service/src:/usr/src/app/services/auth-service/src
      - ./packages/protos:/usr/src/app/packages/protos
    env_file:
      - .env
    environment:
      GRPC_PORT: 50051
      HTTP_PORT: 3000
      DB_URL: postgres://admin:secure_password_123@postgres:5432/pagepulse_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - pagepulse-network

  # --- Book Service ---
  book-service:
    build:
      context: .
      dockerfile: services/book-service/Dockerfile.dev
    ports:
      - "3003:3000"
      - "50052:50052"
    volumes:
      - ./services/book-service/src:/usr/src/app/services/book-service/src
      - ./packages/protos:/usr/src/app/packages/protos
    env_file:
      - .env
    environment:
      GRPC_PORT: 50052
      HTTP_PORT: 3000
      DB_URL: postgres://admin:secure_password_123@postgres:5432/pagepulse_db
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_started
    networks:
      - pagepulse-network

  # --- Chat Service ---
  chat-service:
    build:
      context: .
      dockerfile: services/chat-service/Dockerfile.dev
    ports:
      - "3005:3000"
      - "50053:50053"
    volumes:
      - ./services/chat-service/src:/usr/src/app/services/chat-service/src
      - ./packages/protos:/usr/src/app/packages/protos
    env_file:
      - .env
    environment:
      PORT: 3000
      HTTP_PORT: 3000
      GRPC_PORT: 50053
      DB_URL: postgres://chat_admin:chat_secure_pass_456@postgres-chat:5432/chat_db
      AUTH_GRPC_URL: auth-service:50051
    depends_on:
      postgres-chat:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - pagepulse-network

  # --- Notification Service (FIXED) ---
  notification-service:
    build:
      context: .
      dockerfile: services/notification-service/Dockerfile.dev
    ports:
      - "3007:3000"
    volumes:
      - ./services/notification-service/src:/app/src
      - ./packages/protos:/app/packages/protos
      - ./.env:/app/.env
    env_file:
      - .env
    environment:
      HTTP_PORT: 3000
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672
      AUTH_GRPC_URL: auth-service:50051
      CHAT_GRPC_URL: chat-service:50053
    depends_on:
      rabbitmq:
        condition: service_healthy
      auth-service:
        condition: service_started
    networks:
      - pagepulse-network

networks:
  pagepulse-network:
    driver: bridge

volumes:
  postgres_data:
  postgres_chat_data:
