apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      containers:
      - name: book-service
        image: book-service:v7
        imagePullPolicy: Never
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        ports:
        - containerPort: 3000
        - containerPort: 50051
        env:
        - name: HTTP_PORT
          valueFrom:
            configMapKeyRef:
              name: pagepulse-config
              key: HTTP_PORT
        - name: GRPC_PORT
          valueFrom:
            configMapKeyRef:
              name: pagepulse-config
              key: GRPC_PORT_BOOK
        - name: RABBITMQ_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: RABBITMQ_URL
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: DB_URL
        - name: REDIS_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: REDIS_URL
        - name: REDIS_PORT
          valueFrom:
             configMapKeyRef:
               name: pagepulse-config
               key: REDIS_PORT
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
spec:
  type: NodePort
  selector:
    app: book-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
    nodePort: 30003
  - name: grpc
    port: 50051
    targetPort: 50051
    nodePort: 30004
