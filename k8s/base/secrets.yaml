apiVersion: v1
kind: Secret
metadata:
  name: pagepulse-secrets
type: Opaque
stringData:
  # In a real scenario, never commit this file. Use sealed-secrets or external-secrets.
  POSTGRES_PASSWORD: "secure_password_123"
  RABBITMQ_DEFAULT_PASS: "guest"
  JWT_SECRET: "dev_secret_key_123"
  # Connection strings using K8s Service names
  DB_URL: "postgres://admin:secure_password_123@postgres-service:5432/pagepulse_db"
  RABBITMQ_URL: "amqp://guest:guest@rabbitmq-service:5672"
  REDIS_URL: "redis://redis-service:6379"
