apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: notification-service
  template:
    metadata:
      labels:
        app: notification-service
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
        - name: notification-container
          image: yourdockerhub/notification-service:latest
          imagePullPolicy: IfNotPresent

          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"

          ports:
            - containerPort: 3000

          # Load MOST vars automatically
          envFrom:
            - secretRef:
                name: pagepulse-secrets
            - configMapRef:
                name: pagepulse-config

          # Explicit service-to-service addresses
          env:
            - name: AUTH_GRPC_URL
              value: "auth-service:50051"
            - name: CHAT_GRPC_URL
              value: "chat-service:50053"
          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: notification-service
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 3000
      targetPort: 3000
