apiVersion: apps/v1
kind: Deployment
metadata:
  name: chat-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: chat-service
  template:
    metadata:
      labels:
        app: chat-service
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: chat-container
        image: yourdockerhub/chat-service:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "50m"
            memory: "64Mi"
        ports:
        - containerPort: 3000
        - containerPort: 50053   # ✅ gRPC SERVER PORT (IMPORTANT)
        envFrom:
        - secretRef:
            name: pagepulse-secrets
        - configMapRef:
            name: pagepulse-config
        env:
        - name: AUTH_GRPC_URL
          value: "auth-service:50051"
        - name: GRPC_PORT
          value: "50053"
        - name: DB_URL
          valueFrom:
            secretKeyRef:
              name: pagepulse-secrets
              key: DB_URL_CHAT
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: chat-service
spec:
  type: ClusterIP
  selector:
    app: chat-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: grpc
    port: 50053
    targetPort: 50053
