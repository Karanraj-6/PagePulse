version: '3.8'

services:
  # --- Infrastructure ---
  nginx-gateway:
    build:
      context: ./apps/api-gateway
      dockerfile: Dockerfile
    ports: [ "${NGINX_PORT}:80" ]
    depends_on:
      - auth-service
      - book-service
      - chat-service

    networks:
      - pagepulse-network

  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "${RABBITMQ_PORT}:5672"
      - "${RABBITMQ_MGMT_PORT}:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS}
    networks:
      - pagepulse-network

  redis:
    image: redis:alpine
    ports: [ "${REDIS_PORT}:6379" ]
    networks:
      - pagepulse-network

  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports: [ "${POSTGRES_PORT}:5432" ]
    networks:
      - pagepulse-network

  # --- Services ---
  auth-service:
    build:
      context: ./services/auth-service
    volumes:
      - ./packages/protos:/packages/protos
    environment:
      - GRPC_PORT=${GRPC_PORT_AUTH}
      - HTTP_PORT=${HTTP_PORT}
      - DB_URL=${DB_URL}
      - RABBITMQ_URL=${RABBITMQ_URL}
    networks:
      - pagepulse-network

  book-service:
    build:
      context: ./services/book-service
    volumes:
      - ./packages/protos:/packages/protos
      - ./services/book-service/src:/app/src
    environment:
      - GRPC_PORT=${GRPC_PORT_BOOK}
      - HTTP_PORT=${HTTP_PORT}
      - RABBITMQ_URL=${RABBITMQ_URL}
      - DB_URL=${DB_URL}
      - REDIS_URL=redis://redis:${REDIS_PORT}
    depends_on:
      - rabbitmq
    networks:
      - pagepulse-network

  chat-service:
    build:
      context: ./services/chat-service
    environment:
      - PORT=${HTTP_PORT}
      - DB_URL=${DB_URL}
    volumes:
      - ./services/chat-service/src:/app/src
    networks:
      - pagepulse-network

  notification-service:
    build:
      context: ./services/notification-service
    volumes:
      - ./services/notification-service/src:/app/src
    environment:
      - RABBITMQ_URL=${RABBITMQ_URL}
    depends_on:
      - rabbitmq
    networks:
      - pagepulse-network

networks:
  pagepulse-network:
    driver: bridge
