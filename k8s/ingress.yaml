apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pagepulse-rest-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
spec:
  rules:
  - http:
      paths:
      # REST APIs
      - path: /api/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 3000
      - path: /api/books(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: book-service
            port:
              number: 3000
      - path: /api/chat(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: chat-service
            port:
              number: 3000
      # NOTE: notification-service is a RabbitMQ consumer only - no HTTP endpoint
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: pagepulse-grpc-ingress
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/use-regex: "true"
    nginx.ingress.kubernetes.io/rewrite-target: /$2
    # Enable HTTP/2 for gRPC - only applies to this Ingress
    nginx.ingress.kubernetes.io/backend-protocol: "GRPC"
spec:
  rules:
  - http:
      paths:
      # gRPC services
      - path: /grpc/auth(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: auth-service
            port:
              number: 50051
      - path: /grpc/book(/|$)(.*)
        pathType: ImplementationSpecific
        backend:
          service:
            name: book-service
            port:
              number: 50052
