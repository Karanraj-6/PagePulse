apiVersion: apps/v1
kind: Deployment
metadata:
  name: book-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: book-service
  template:
    metadata:
      labels:
        app: book-service
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: book-container
        image: docker.io/yourdockerhub/book-service:latest
        imagePullPolicy: IfNotPresent
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
        ports:
        - containerPort: 3000
        - containerPort: 50052
        envFrom:
        - secretRef:
            name: pagepulse-secrets
        - configMapRef:
            name: pagepulse-config
        env:
        - name: GRPC_PORT
          value: "50052"
        readinessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
        livenessProbe:
          httpGet:
            path: /health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: book-service
spec:
  type: ClusterIP
  selector:
    app: book-service
  ports:
  - name: http
    port: 3000
    targetPort: 3000
  - name: grpc
    port: 50052
    targetPort: 50052
